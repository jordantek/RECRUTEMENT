spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Datasource Sage
sage.datasource.url=jdbc:mysql://localhost:3306/ettdb
sage.datasource.username=root
sage.datasource.password=root
