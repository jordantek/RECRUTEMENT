<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            background-color: #ffffff;
            margin: 30px auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #f4f4f7;
            padding: 20px;
            text-align: center;
        }
        .header img {
            max-height: 60px;
        }
        .content {
            padding: 30px;
            color: #333333;
        }
        .content h4 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #1a73e8;
        }
        .content p {
            font-size: 10px;
            line-height: 1.6;
        }
        .footer {
            background-color: #f4f4f7;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #000;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header avec logo -->
    <div class="header">
        <img th:if="${logoPath != null}" src="cid:companyLogo" alt="Logo Entreprise" width="100">
    </div>
    <!-- Contenu dynamique -->
    <div class="content">
        <h4>[[${title}]]</h4>
        <p>[[${message}]]</p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 - Talents Gest Paie. Tous droits réservés.</p>
    </div>
</div>
</body>
</html>
